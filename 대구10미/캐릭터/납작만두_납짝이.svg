<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-labelledby="title desc">
  <title id="title">납짝이</title>
  <desc id="desc">철판 위에서 몸을 빙글 돌려 종이처럼 얇아졌다가 뿌듯하게 다시 나타나는 납작만두 캐릭터</desc>

  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE6B2"/>
      <stop offset="1" stop-color="#E9B86A"/>
    </linearGradient>
  </defs>

  <style>
    g, path, circle, ellipse, rect { transform-box: view-box; }

    /* 빙글 돌면 종잇장, 다시 돌면 짠 */
    .flat { transform-origin: 200px 365px; animation: flat 2.6s infinite ease-in-out; }
    @keyframes flat {
      0%, 22%, 100% { transform: scale(1, 1); }
      32%           { transform: scale(.04, 1); }
      42%           { transform: scale(1, 1); }
      52%           { transform: scale(.04, 1); }
      62%           { transform: scale(1, 1); }
      74%           { transform: translateY(-50px) scale(.96, 1.05); }
      86%           { transform: translateY(0) scale(1.1, .84); }
      94%           { transform: translateY(0) scale(.98, 1.03); }
    }

    .shadow { transform-origin: 200px 368px; animation: shadow 2.6s infinite ease-in-out; }
    @keyframes shadow {
      0%, 22%, 42%, 62%, 100% { transform: scale(1, 1); }
      32%, 52%                { transform: scale(.12, 1); }
      74%                     { transform: scale(.7, 1); }
    }

    .arm-l { transform-origin: 72px 288px; animation: armL .45s infinite alternate ease-in-out; }
    @keyframes armL {
      from { transform: rotate(-22deg); }
      to   { transform: rotate(18deg); }
    }
    .arm-r { transform-origin: 328px 288px; animation: armR .45s infinite alternate ease-in-out; }
    @keyframes armR {
      from { transform: rotate(22deg); }
      to   { transform: rotate(-18deg); }
    }

    .blink { transform-origin: 200px 250px; animation: blink 2.6s infinite; }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(.08); }
    }

    .heat { animation: heat 1.4s infinite ease-out; opacity: 0; }
    .heat.b { animation-delay: -.45s; }
    .heat.c { animation-delay: -.9s; }
    @keyframes heat {
      0%   { transform: translateY(0); opacity: 0; }
      30%  { opacity: .75; }
      100% { transform: translateY(-40px); opacity: 0; }
    }

    .word { transform-origin: 322px 70px; animation: word 2.6s infinite ease-in-out; }
    @keyframes word {
      0%, 62%, 100% { transform: scale(.94) rotate(-3deg); }
      74%           { transform: scale(1.14) rotate(5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .heat { opacity: .4; }
    }
  </style>

  <!-- 말풍선 -->
  <g class="word">
    <path d="M268 42h108a14 14 0 0 1 14 14v28a14 14 0 0 1-14 14h-62l-20 20 4-20h-30a14 14 0 0 1-14-14V56a14 14 0 0 1 14-14Z" fill="#FFF8EA" stroke="#5A2E14" stroke-width="4" stroke-linejoin="round"/>
    <text x="322" y="80" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="800" fill="#C2410C">납작!</text>
  </g>

  <!-- 철판 -->
  <rect x="24" y="368" width="352" height="24" rx="8" fill="#3A3532" stroke="#111" stroke-width="5"/>
  <path d="M48 380h120" stroke="#6B635D" stroke-width="5" stroke-linecap="round"/>
  <ellipse class="shadow" cx="200" cy="366" rx="150" ry="6" fill="#111" opacity=".3"/>
  <g fill="none" stroke="#E8A36A" stroke-width="5" stroke-linecap="round">
    <path class="heat" d="M62 356c-7-9 7-14 0-24"/>
    <path class="heat b" d="M340 356c7-9-7-14 0-24"/>
    <path class="heat c" d="M360 354c-7-9 7-14 0-24"/>
  </g>

  <g class="flat">
    <!-- 가느다란 다리 -->
    <path d="M150 316V356h-18M250 316V356h18" fill="none" stroke="#6B4A1E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 가느다란 팔 -->
    <path class="arm-l" d="M72 288C54 280 42 266 38 246" fill="none" stroke="#6B4A1E" stroke-width="7" stroke-linecap="round"/>
    <path class="arm-r" d="M328 288C346 280 358 266 362 246" fill="none" stroke="#6B4A1E" stroke-width="7" stroke-linecap="round"/>

    <!-- 반달 몸 -->
    <path d="M44 310C56 158 344 158 356 310Q200 336 44 310Z" fill="url(#skin)" stroke="#6B4A1E" stroke-width="6" stroke-linejoin="round"/>

    <!-- 만두 주름 -->
    <path d="M78 248l14 12M108 220l10 15M144 200l7 17M182 192l3 18M222 192l-3 18M258 200l-7 17M294 220l-10 15M322 248l-14 12" stroke="#C99347" stroke-width="5" stroke-linecap="round"/>

    <!-- 노릇한 자국 -->
    <g fill="#B8702A" opacity=".55">
      <ellipse cx="94" cy="296" rx="16" ry="7"/>
      <ellipse cx="312" cy="298" rx="18" ry="6"/>
      <ellipse cx="204" cy="310" rx="20" ry="5"/>
    </g>

    <!-- 파 양념 모자 -->
    <path d="M160 188C176 168 224 168 240 188C222 198 178 198 160 188Z" fill="#9A4A1E" stroke="#5A2E14" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#5DA83A">
      <rect x="176" y="176" width="14" height="6" rx="2"/>
      <rect x="204" y="178" width="14" height="6" rx="2"/>
    </g>
    <circle cx="196" cy="186" r="3" fill="#D9361F"/><circle cx="222" cy="186" r="3" fill="#D9361F"/>

    <!-- 얼굴 -->
    <g class="blink">
      <circle cx="160" cy="250" r="15" fill="#2B150A"/>
      <circle cx="240" cy="250" r="15" fill="#2B150A"/>
      <circle cx="165" cy="244" r="5.5" fill="#fff"/>
      <circle cx="245" cy="244" r="5.5" fill="#fff"/>
      <circle cx="155" cy="256" r="2.5" fill="#fff"/>
      <circle cx="235" cy="256" r="2.5" fill="#fff"/>
    </g>
    <path d="M140 224q14-9 28-3M232 221q14-6 28 3" fill="none" stroke="#3F1D0B" stroke-width="5.5" stroke-linecap="round"/>
    <ellipse cx="128" cy="276" rx="16" ry="9" fill="#F2785C" opacity=".7"/>
    <ellipse cx="272" cy="276" rx="16" ry="9" fill="#F2785C" opacity=".7"/>
    <path d="M178 268q22 26 44 0Z" fill="#7A1F14" stroke="#3F1D0B" stroke-width="5" stroke-linejoin="round"/>
    <path d="M191 279q9-6 18 0q-9 6-18 0Z" fill="#F46B5D"/>
  </g>
</svg>
