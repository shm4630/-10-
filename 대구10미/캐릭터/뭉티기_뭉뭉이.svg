<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-labelledby="title desc">
  <title id="title">뭉뭉이</title>
  <desc id="desc">다가오는 젓가락을 쫀득하게 흔들리며 피하는 부끄럼쟁이 뭉티기 캐릭터</desc>

  <defs>
    <linearGradient id="meat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5475A"/>
      <stop offset="1" stop-color="#A31F36"/>
    </linearGradient>
  </defs>

  <style>
    g, path, circle, ellipse, rect { transform-box: view-box; }

    /* 젓가락 슬쩍 피하고 쫀득하게 출렁 */
    .dodge { transform-origin: 200px 348px; animation: dodge 2.2s infinite ease-in-out; }
    @keyframes dodge {
      0%, 100% { transform: translateX(0) skewX(0deg); }
      22%      { transform: translateX(0) skewX(0deg); }
      34%      { transform: translateX(38px) skewX(-13deg); }
      44%      { transform: translateX(38px) skewX(9deg); }
      52%      { transform: translateX(38px) skewX(-6deg); }
      60%      { transform: translateX(38px) skewX(3deg); }
      72%      { transform: translateX(38px) skewX(0deg); }
      86%      { transform: translateX(-6px) skewX(5deg); }
    }

    .sticks { animation: sticks 2.2s infinite ease-in-out; }
    @keyframes sticks {
      0%, 8%, 100% { transform: translate(-34px, -34px); }
      30%, 42%     { transform: translate(38px, 38px); }
      56%          { transform: translate(38px, 38px); }
      74%          { transform: translate(-34px, -34px); }
    }

    .blush { animation: blush 2.2s infinite ease-in-out; }
    @keyframes blush {
      0%, 22%, 100% { opacity: .55; }
      40%, 62%      { opacity: 1; }
    }

    .blink { transform-origin: 200px 236px; animation: blink 2.9s infinite; }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(.08); }
    }

    /* 윤기 반짝 */
    .shine { transform-origin: var(--o); animation: shine 1.5s infinite ease-in-out; }
    .shine.b { animation-delay: -.75s; }
    @keyframes shine {
      0%, 100% { transform: scale(.3) rotate(0deg); opacity: 0; }
      50%      { transform: scale(1) rotate(45deg); opacity: 1; }
    }

    .sweat { animation: sweat 1.1s infinite ease-in; opacity: 0; }
    @keyframes sweat {
      0%   { transform: translateY(0); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translateY(32px); opacity: 0; }
    }

    .word { transform-origin: 322px 70px; animation: word 1.1s infinite ease-in-out; }
    @keyframes word {
      0%, 100% { transform: scale(.94) rotate(-3deg); }
      50%      { transform: scale(1.06) rotate(4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .shine, .sweat { opacity: .7; }
    }
  </style>

  <!-- 말풍선 -->
  <g class="word">
    <path d="M268 42h108a14 14 0 0 1 14 14v28a14 14 0 0 1-14 14h-62l-20 20 4-20h-30a14 14 0 0 1-14-14V56a14 14 0 0 1 14-14Z" fill="#FFF8EA" stroke="#5A2E14" stroke-width="4" stroke-linejoin="round"/>
    <text x="322" y="79" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="25" font-weight="800" fill="#C2410C">쫀득쫀득</text>
  </g>

  <!-- 접시 -->
  <path d="M46 352H354C350 382 310 392 200 392S50 382 46 352Z" fill="#FFFDF6" stroke="#5A4A3A" stroke-width="6" stroke-linejoin="round"/>
  <path d="M84 370q60 9 130 7" fill="none" stroke="#4E9AC9" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/>
  <ellipse cx="200" cy="404" rx="150" ry="8" fill="#2B211C" opacity=".2"/>

  <!-- 참기름 양념 종지 -->
  <path d="M26 322H100C98 346 84 352 63 352S28 346 26 322Z" fill="#F5EFE3" stroke="#5A2E14" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="63" cy="322" rx="37" ry="10" fill="#D9861F" stroke="#5A2E14" stroke-width="5"/>
  <circle cx="52" cy="321" r="3" fill="#D9361F"/><circle cx="66" cy="324" r="3" fill="#FFF3D6"/><circle cx="78" cy="320" r="3" fill="#D9361F"/>

  <g class="dodge">
    <!-- 몸통 -->
    <path d="M118 204C116 176 150 168 200 170C252 168 286 176 286 206L294 312C294 346 108 346 110 312Z" fill="url(#meat)" stroke="#5E0F20" stroke-width="6" stroke-linejoin="round"/>
    <path d="M128 322C150 296 170 312 186 324M238 186C258 196 262 216 276 226" fill="none" stroke="#F6A6AE" stroke-width="5" stroke-linecap="round" opacity=".6"/>
    <path d="M138 196q-8 22-6 50" fill="none" stroke="#FFE3E6" stroke-width="9" stroke-linecap="round" opacity=".8"/>
    <circle cx="134" cy="264" r="5" fill="#FFE3E6" opacity=".8"/>

    <!-- 얼굴 -->
    <g class="blink">
      <circle cx="168" cy="236" r="14" fill="#2B0A12"/>
      <circle cx="240" cy="236" r="14" fill="#2B0A12"/>
      <circle cx="163" cy="230" r="5.5" fill="#fff"/>
      <circle cx="235" cy="230" r="5.5" fill="#fff"/>
      <circle cx="172" cy="242" r="2.5" fill="#fff"/>
      <circle cx="244" cy="242" r="2.5" fill="#fff"/>
    </g>
    <path d="M150 208q12-8 26-2M232 206q14-6 26 2" fill="none" stroke="#3A0A14" stroke-width="5.5" stroke-linecap="round"/>
    <g class="blush" fill="#FFB3BC">
      <ellipse cx="146" cy="268" rx="18" ry="10"/>
      <ellipse cx="260" cy="268" rx="18" ry="10"/>
    </g>
    <path d="M186 276q9-10 18 0t18 0" fill="none" stroke="#3A0A14" stroke-width="5.5" stroke-linecap="round"/>

    <!-- 식은땀 -->
    <path class="sweat" d="M286 190c-5 8-7 11-7 13a7 7 0 0 0 14 0c0-2-2-5-7-13Z" fill="#8AD3F5" stroke="#2B7FB8" stroke-width="2"/>
  </g>

  <!-- 윤기 -->
  <path class="shine" style="--o:366px 170px" d="M366 152l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z" fill="#FFD86B" stroke="#C98A1C" stroke-width="2.5" stroke-linejoin="round"/>
  <path class="shine b" style="--o:92px 256px" d="M92 242l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z" fill="#FFD86B" stroke="#C98A1C" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 다가오는 젓가락 -->
  <g class="sticks" stroke-linecap="round">
    <path d="M6 30L92 150" stroke="#5A3418" stroke-width="13"/>
    <path d="M6 30L92 150" stroke="#C98A4B" stroke-width="6"/>
    <path d="M38 8L112 138" stroke="#5A3418" stroke-width="13"/>
    <path d="M38 8L112 138" stroke="#C98A4B" stroke-width="6"/>
  </g>
</svg>
